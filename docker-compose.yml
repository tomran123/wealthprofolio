name: wealthprofolio

x-backend-environment: &backend-environment
  DATABASE_URL: postgresql+asyncpg://wealthportfolio:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/wealthportfolio
  REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0
  CELERY_BROKER_URL: amqp://${RABBITMQ_USER:?Set RABBITMQ_USER in .env}:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/wealthportfolio
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
  AGENT_JOB_BACKEND: celery
  AGENT_INLINE_FALLBACK: "false"
  PRICE_JOB_BACKEND: celery
  PRICE_INLINE_FALLBACK: "false"
  DOCUMENT_JOB_BACKEND: celery
  DOCUMENT_INLINE_FALLBACK: "false"
  DOCUMENT_STORAGE_BACKEND: minio
  DOCUMENT_STORAGE_ENDPOINT: http://minio:9000
  DOCUMENT_STORAGE_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
  DOCUMENT_STORAGE_BUCKET: ${MINIO_BUCKET:-wealthportfolio-private}
  DOCUMENT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
  DOCUMENT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
  DOCUMENT_STORAGE_REGION: ${MINIO_REGION:-us-east-1}
  DOCUMENT_STORAGE_SECURE: "false"
  DOCUMENT_CLAMAV_HOST: clamav
  DOCUMENT_CLAMAV_PORT: "3310"
  DOCUMENT_CLAMAV_REQUIRED: "true"

x-backend-runtime: &backend-runtime
  image: wealthprofolio-backend:${IMAGE_TAG:-local}
  env_file:
    - path: .env
      required: false
  environment:
    <<: *backend-environment
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:size=512m,mode=1777
    - /app/data:size=64m,mode=0700,uid=10001,gid=10001

services:
  postgres:
    build:
      context: ./ops/postgres
    image: wealthprofolio-postgres-pgvector:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      POSTGRES_USER: wealthportfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: wealthportfolio
    volumes:
      # Kept intentionally unchanged. The custom image remains based on
      # postgres:16-alpine, matching the previous libc/locale family while
      # adding a pinned pgvector extension.
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U wealthportfolio -d wealthportfolio
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 60s

  migrate:
    <<: *backend-runtime
    restart: "no"
    command:
      - alembic
      - upgrade
      - head
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    restart: unless-stopped
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: wealthportfolio
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command:
      - server
      - /data
      - --console-address
      - :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_REGION_NAME: ${MINIO_REGION:-us-east-1}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:9000/minio/health/live
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-wealthportfolio-private}
    volumes:
      - ./ops/minio/cors.xml:/config/cors.xml:ro
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        mc anonymous set none "local/$$MINIO_BUCKET"
        mc cors set "local/$$MINIO_BUCKET" /config/cors.xml
    depends_on:
      minio:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  clamav:
    image: clamav/clamav:1.4.3
    restart: unless-stopped
    volumes:
      - clamav_signatures:/var/lib/clamav
    expose:
      - "3310"
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/clamdcheck.sh
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true

  backend:
    <<: *backend-runtime
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:8000/api/health
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    stop_grace_period: 30s

  celery-worker:
    <<: *backend-runtime
    restart: unless-stopped
    command:
      - celery
      - -A
      - app.worker:celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=${CELERY_CONCURRENCY:-2}
      - --hostname=celery@%h
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A app.worker:celery_app inspect ping --destination "celery@$$HOSTNAME" --timeout 5 | grep -q pong
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    stop_grace_period: 90s

  frontend:
    build:
      context: ./frontend
      target: runtime
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
    image: wealthprofolio-frontend:${IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s

  # Local backups are opt-in and encrypted before they reach the host.
  # Production backups must use RDS automatic backups plus encrypted OSS.
  backup:
    profiles:
      - backup
    build:
      context: ./ops/backup
    image: wealthprofolio-backup:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: wealthportfolio
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: wealthportfolio
      BACKUP_ENCRYPTION_PASSPHRASE: ${BACKUP_ENCRYPTION_PASSPHRASE:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./backups:/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  clamav_signatures:
